<!doctype html>
<html lang="cs">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detail hry · Game Index</title>
    <script src="scripts/color-mode.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles/app.css">
</head>

<body>
    <nav id="game-navbar" class="navbar navbar-overlay bg-1 border-bottom px-3 py-3" aria-label="Hlavní navigace">
        <a href="./" class="navbar-back btn-text" aria-label="Zpět na seznam her">
            <i class="bi bi-chevron-left" aria-hidden="true"></i> Zpět
        </a>
        <div class="ms-auto">
            <button id="color-mode-toggle" type="button" class="btn-text" data-bs-toggle="menu"
                data-bs-placement="bottom-end" aria-expanded="false" aria-controls="color-mode-menu"
                aria-label="Barevný režim: Podle systému">
                <i id="color-mode-icon" class="bi bi-circle-half" aria-hidden="true"></i>
                <i class="bi bi-chevron-expand" aria-hidden="true"></i>
            </button>
            <div id="color-mode-menu" class="menu" aria-labelledby="color-mode-toggle">
                <button type="button" class="menu-item" data-bs-theme-value="light" aria-pressed="false">
                    <i class="bi bi-sun-fill" aria-hidden="true"></i> Světlý
                    <i class="bi bi-check2 ms-auto d-none" data-theme-check aria-hidden="true"></i>
                </button>
                <button type="button" class="menu-item" data-bs-theme-value="dark" aria-pressed="false">
                    <i class="bi bi-moon-stars-fill" aria-hidden="true"></i> Tmavý
                    <i class="bi bi-check2 ms-auto d-none" data-theme-check aria-hidden="true"></i>
                </button>
                <button type="button" class="menu-item active" data-bs-theme-value="auto" aria-pressed="true">
                    <i class="bi bi-circle-half" aria-hidden="true"></i> Podle systému
                    <i class="bi bi-check2 ms-auto" data-theme-check aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>
    <main id="game-detail" hidden>
        <div id="hero" class="hero"></div>
        <div id="sticky-title" class="sticky-header d-flex shadow align-items-center">
            <strong id="game-title" class="fs-2xl flex-fill"></strong>
            <a id="start-play-a" class="btn-solid btn-sm theme-success shadow-sm" role="button" aria-label="Zapsat partii v BGStats"><i class="bi bi-play-fill"></i></a>
        </div>
        <div class="sm:container mt-5">
            <div class="d-flex basic-info justify-content-center">
                <div id="players" class="card mx-1 shadow-sm">
                    <i class="bi bi-person-standing"></i>
                    <span id="players-value"></span>
                </div>
                <div id="playtime" class="card mx-1 shadow-sm">
                    <i class="bi bi-hourglass-split"></i>
                    <span id="playtime-value"></span>
                </div>
                <div id="weight" class="card mx-1 shadow-sm">
                    <i class="bi bi-speedometer2"></i>
                    <span id="weight-value"></span>
                </div>
            </div>
            <div id="game-description" class="mt-5"></div>
            <nav id="game-links" aria-label="Odkazy ke hře"></nav>
        </div>
    </main>
    <p id="game-status" class="p-5" role="status">Načítám hru…</p>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="scripts/game-detail.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
