<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krvavá hodina odbyla — Záznam partie</title>
<script src="scripts/color-mode.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<nav class="navbar d-flex flex-nowrap bg-1 border-bottom px-3 py-3" aria-label="Hlavní navigace">
  <div class="col-3">
    <a href="game.html?id=krvava-hodina" class="btn-text" aria-label="Zpět na hru"><i class="bi bi-chevron-left" aria-hidden="true"></i><span class="d-none md:d-inline"> Zpět na hru</span></a>
  </div>
  <h1 class="col-6 text-center fs-lg mb-0">Krvavá hodina odbyla</h1>
  <div class="col-3 d-flex justify-content-end">
    <button id="color-mode-toggle" type="button" class="btn-text" data-bs-toggle="menu"
        data-bs-placement="bottom-end" aria-expanded="false" aria-controls="color-mode-menu"
        aria-label="Barevný režim: Podle systému">
      <i id="color-mode-icon" class="bi bi-circle-half" aria-hidden="true"></i>
      <i class="bi bi-chevron-expand" aria-hidden="true"></i>
    </button>
    <div id="color-mode-menu" class="menu" aria-labelledby="color-mode-toggle">
      <button type="button" class="menu-item" data-bs-theme-value="light" aria-pressed="false">
        <i class="bi bi-sun-fill" aria-hidden="true"></i> Světlý
        <i class="bi bi-check2 ms-auto d-none" data-theme-check aria-hidden="true"></i>
      </button>
      <button type="button" class="menu-item" data-bs-theme-value="dark" aria-pressed="false">
        <i class="bi bi-moon-stars-fill" aria-hidden="true"></i> Tmavý
        <i class="bi bi-check2 ms-auto d-none" data-theme-check aria-hidden="true"></i>
      </button>
      <button type="button" class="menu-item active" data-bs-theme-value="auto" aria-pressed="true">
        <i class="bi bi-circle-half" aria-hidden="true"></i> Podle systému
        <i class="bi bi-check2 ms-auto" data-theme-check aria-hidden="true"></i>
      </button>
    </div>
  </div>
</nav>

<main class="container pb-12 d-flex flex-column gap-7 mt-7">

  <!-- METADATA -->
  <section class="card" aria-labelledby="metadata-title">
    <div class="card-header d-flex flex-row flex-nowrap align-items-center gap-3">
      <h2 id="metadata-title" class="fs-lg mb-0">📜 Údaje o partii</h2>
      <button type="button" class="btn-text ms-auto" data-bs-toggle="dialog" data-bs-target="#import-dialog" aria-controls="import-dialog" aria-haspopup="dialog" aria-label="Načíst partii z BGStats" title="Načíst partii z BGStats">
        <i class="bi bi-upload" aria-hidden="true"></i>
      </button>
    </div>
    <div class="card-body">
      <div class="row g-5">
        <div class="col-6 md:col-3">
          <label for="play-date" class="d-block mb-3">Datum</label>
          <input class="form-control" type="date" id="play-date">
        </div>
        <div class="col-6 md:col-3">
          <label for="play-start" class="d-block mb-3">Začátek</label>
          <input class="form-control" type="time" id="play-start" oninput="setDefaultEndTime()">
        </div>
        <div class="col-6 md:col-3">
          <label for="play-end" class="d-block mb-3">Konec</label>
          <input class="form-control" type="time" id="play-end" oninput="calcDuration()">
        </div>
        <div class="col-6 md:col-3">
          <label for="duration-display" class="d-block mb-3">Délka partie</label>
          <output class="form-control bg-1" id="duration-display" for="play-start play-end" aria-live="polite">—</output>
        </div>
        <div class="col-12 md:col-6">
          <p id="script-label">Skript</p>
          <div id="script-buttons" class="d-flex flex-wrap gap-3" role="group" aria-labelledby="script-label"></div>
        </div>
        <div class="col-12 md:col-3">
          <label for="play-location" class="d-block mb-3">Lokace</label>
          <select id="play-location" class="form-control"></select>
        </div>
        <div class="col-12 md:col-3">
          <label for="play-game-copy" class="d-block mb-3">Kopie hry</label>
          <select id="play-game-copy" class="form-control"></select>
        </div>
      </div>
    </div>
  </section>

  <!-- PLAYERS -->
  <section class="card" aria-labelledby="players-title">
    <h2 id="players-title" class="card-header fs-lg mb-0">👥 Hráči</h2>
    <div class="card-body">
      <div id="players-list" class="d-flex flex-column gap-5">
        <div id="storyteller-row" class="row g-3 align-items-center border rounded-5 p-3 mx-0">
          <label for="storyteller-name" class="player-num col-12 md:col-1 text-center fg-3 text-break">Vypravěč</label>
          <div class="col-12 md:col-4">
            <input class="form-control" type="text" id="storyteller-name" list="known-players" placeholder="Jméno vypravěče…" autocomplete="off">
          </div>
        </div>
      </div>
      <datalist id="known-players"></datalist>
    </div>
    <div class="card-footer d-flex flex-wrap gap-3 p-5 bg-1 border-bottom fs-sm">
      <button type="button" class="btn-outline theme-secondary" onclick="addPlayer(true)">＋ Přidat hráče</button>
      <div id="summary-bar" class="d-flex align-items-center" role="status">
        0: 0/0/0/0
      </div>
      <div class="d-flex align-items-center gap-3 ms-auto" role="group" aria-labelledby="winner-label">
        <span id="winner-label">Vítězný tým</span>
        <button type="button" class="btn-outline theme-info" id="btn-good" aria-label="Dobří" title="Dobří" aria-pressed="false" onclick="setWinner('good')">👍</button>
        <button type="button" class="btn-outline theme-danger" id="btn-evil" aria-label="Zlí" title="Zlí" aria-pressed="false" onclick="setWinner('evil')">👎</button>
      </div>
    </div>
  </section>

  <div class="d-flex flex-wrap gap-3">
    <button type="button" class="btn-subtle theme-secondary flex-fill" onclick="downloadBgsplay()">⬇️ Stáhnout</button>
    <button type="button" class="btn-subtle theme-primary flex-fill" onclick="openInApp()">📱 BG Stats Import</button>
  </div>
  <p id="export-status" class="fs-sm fg-3 mb-0" role="status" hidden></p>
</main>

<dialog id="import-dialog" class="dialog" aria-labelledby="import-dialog-title" aria-describedby="import-dialog-description">
  <div class="dialog-header">
    <h2 id="import-dialog-title" class="dialog-title">Načíst partii z BGStats</h2>
    <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Zavřít"></button>
  </div>
  <div class="dialog-body">
    <p id="import-dialog-description">Vyber soubor s jednou partií Krvavé hodiny. Načtení nahradí aktuální údaje ve formuláři.</p>
    <label for="import-play" class="d-block mb-3">Soubor z BGStats (.bgsplay)</label>
    <input class="form-control" type="file" id="import-play" accept=".bgsplay,application/json" onchange="importBgsplayFile(this)">
    <p id="import-status" class="fs-sm mt-3 mb-0" role="status" hidden></p>
  </div>
  <div class="dialog-footer">
    <button type="button" class="btn-outline theme-secondary" data-bs-dismiss="dialog">Zavřít</button>
  </div>
</dialog>

<script src="scripts/botc-play.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
</body>
</html>
