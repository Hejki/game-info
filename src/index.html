<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hejki's Game Index</title>
    <script src="scripts/legacy-links.js"></script>
    <script src="scripts/color-mode.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="styles/app.css">
</head>

<body>
    <nav class="navbar bg-1 border-bottom px-7 py-3" aria-label="Hlavní navigace">
        <a href="./" class="navbar-brand">Game Index</a>
        <div class="ms-auto">
            <button id="color-mode-toggle" type="button" class="btn-text" data-bs-toggle="menu"
                data-bs-placement="bottom-end" aria-expanded="false" aria-controls="color-mode-menu"
                aria-label="Barevný režim: Podle systému">
                <i id="color-mode-icon" class="bi bi-circle-half" aria-hidden="true"></i>
                <i class="bi bi-chevron-expand" aria-hidden="true"></i>
            </button>
            <div id="color-mode-menu" class="menu" aria-labelledby="color-mode-toggle">
                <button type="button" class="menu-item" data-bs-theme-value="light" aria-pressed="false">
                    <i class="bi bi-sun-fill" aria-hidden="true"></i> Světlý
                    <i class="bi bi-check2 ms-auto d-none" data-theme-check aria-hidden="true"></i>
                </button>
                <button type="button" class="menu-item" data-bs-theme-value="dark" aria-pressed="false">
                    <i class="bi bi-moon-stars-fill" aria-hidden="true"></i> Tmavý
                    <i class="bi bi-check2 ms-auto d-none" data-theme-check aria-hidden="true"></i>
                </button>
                <button type="button" class="menu-item active" data-bs-theme-value="auto" aria-pressed="true">
                    <i class="bi bi-circle-half" aria-hidden="true"></i> Podle systému
                    <i class="bi bi-check2 ms-auto" data-theme-check aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>
    <main id="game-index-view" aria-label="Seznam her" class="container">
        <div class="p-5">
            <label for="game-search" class="visually-hidden">Vyhledat hru podle názvu</label>
            <input id="game-search" type="search" class="form-control" placeholder="Vyhledat hru…"
                aria-controls="game-index-table" autocomplete="off" disabled>
            <p id="game-search-count" class="fg-3 mt-3 mb-0" role="status"></p>
        </div>
        <p id="game-index-status" class="p-5" role="status">Načítám seznam her…</p>
        <p id="game-search-empty" class="p-5" hidden>Žádná hra neodpovídá hledání.</p>
        <div id="game-index-table" class="mx-auto table-responsive" hidden>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col"><span class="visually-hidden">Hra</span></th>
                        <th scope="col" class="text-center"><i class="bi bi-person-standing" aria-hidden="true"></i><span class="visually-hidden">Počet hráčů</span></th>
                        <th scope="col" class="text-center"><i class="bi bi-hourglass-split" aria-hidden="true"></i><span class="visually-hidden">Herní doba</span></th>
                        <th scope="col" class="text-center"><i class="bi bi-speedometer2" aria-hidden="true"></i><span class="visually-hidden">Obtížnost</span></th>
                    </tr>
                </thead>
                <tbody id="game-index"></tbody>
            </table>
        </div>
    </main>
    <script src="scripts/game-index.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
