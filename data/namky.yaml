description: |
  **Ňamky** jsou kostková zakreslovací hra plná ovocných špízů. Házíte
  kostkami, sestavujete ovocné kombinace a zaškrtáváte srdíčka a bonusy
  na svém herním listu. Za získané hvězdičky si pořizujete karty, které
  mění výsledky hodů, přinášejí další možnosti a vytvářejí silné kombinace.

  Ani během tahů soupeřů nezůstáváte stranou: některé jejich výsledky
  přinesou bonus i vám. Cílem je zaplnit svou stupnici srdíček rychleji
  než ostatní. V sólovém režimu se místo soupeřů utkáte s virtuálním BOTem.
