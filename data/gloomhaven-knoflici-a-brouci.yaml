description: |
  **Gloomhaven: Knoflíci a brouci** je samostatné sólové dobrodružství
  v malé krabičce. Váš hrdina byl zmenšen kouzlem a musí se probojovat
  nebezpečným světem, aby našel cestu zpět ke své původní velikosti.
  Základní Gloomhaven ke hraní nepotřebujete.

  V každém scénáři plánujete pohyb a souboje pomocí dvojic karet
  schopností. Kombinujete horní a dolní akce, hlídáte iniciativu
  a omezenou zásobu karet, zatímco nestvůry řídí herní pravidla.
  Postupem příběhovou kampaní získáváte vybavení a rozvíjíte schopnosti
  zvoleného žoldnéře. Malé herní plány přitom vyžadují důsledné taktické
  plánování a správné načasování útoků i odpočinku.
