description: |
  ### Před začátkem hry

  Před dlouhou dobou v ospalém městečku Bludný Krkavčín, během děsivé bouře, se úderem půlnoci uličkami mezi zdmi pokrytými popínavými rostlinami rozlehne křik.
  Spěcháte zjistit, co se stalo, a zjistíte, že oblíbený vypravěč příběhů byl zavražděn... je nabodnutý na velkou ručičku hodin na kostelní věži,
  krev z jeho bezvládného těla stéká na dlažební kostky. Předpokládáte, že je to dílo Démona, a máte pravdu - Démona, který v noci zabíjí a přes den na sebe bere lidskou podobu.

  Nyní obdržíte buď červený, nebo modrý žeton. Bude-li modrý, jste na straně dobra. Bude-li červený, jste na straně zla.
  Cílem hry dobrých hráčů je najít a popravit Démona. Pokud Démon zemře, dobro vítězí. Cilem hry zlých hráčů je zničit město.
  Pokud zůstanou naživu jen dva hráči, zlo vítězí.
  
  Hra je rozdělena do dvou fází: denní a noční. Během dne se bavíte. Každý z vás bude mít tajnou identitu - postavu z přehledu.
  Hráči na straně dobra obvykle sdílejí vše, co vědí, a snaži se zjistit, kdo je kdo. Většina dobrých hráčů bude mluvit pravdu,
  někteří však mají dobrý důvod lhát. Pokud jste na straně zla, rozhodně byste lhát měli! Nejlepší je vybrat si dobrou postavu,
  za kterou se budete vydávat, a šiřit co nejvice dezinformací.

  Během noci všichni zavřete oči. Vypravěč některé hráče poté probudí, aby mohli využít své schopnosti nebo ziskat určité informace.
  V noci bude vypravěč mlčet, komunikovat bude pomocí následujících signálů: (_Uvedené signály během popisu předvádějte._)

  * 2 poklepání na rameno nebo koleno znamenají **OTEVŘÍT OČI**.
  * Toto znamená **ZAVŘÍT OČI** 🤦.
  * Toto znamená **ANO** 🙂‍↕️ a toto znamená **NE** 🙂‍↔️. 
  * Toto je znamení pro **STRANU DOBRA** 👍 a toto pro **STRANU ZLA* 👎.
  * Toto znamená 0 👌, 1 ☝️, 2 ✌️, 3 a tak dále.
  * Pro výběr hráče v noci na něj jednoduše TAKTO UKAŽTE 👇.

  Většina z vás zemře. Je to ale dobrá věc! V Bludném Krkavčíně smrt neznamená konec.
  Někteří hráči dokonce chtějí zemřít, protože tím získají informace. Pokud jste mrtví, stále se účastníte hry,
  můžete mluvit a společně se svým týmem vyhráváte, nebo prohráváte.

  Ve hře je spousta informací. Nicméně některé z nich mohou být falešné. Pokud jste opilí nebo otrávení, nemáte žádnou schopnost,
  vypravěč však bude předstírat, že ji máte. Může vám lhát - jakékoli informace, které získáte, mohou být nesprávné, vy ale nebudete vědět,
  zda jste opilí či otrávení. Jste-li například Opilec, vytáhli jste z pytliku jiný žeton postavy a jen vypravěč ví, že jste ve skutečnosti Opilec.
  Nebo pokud vás Travič otráví, stále se můžete v noci probudit a použit svou schopnost, ale nebude fungovat.

  To je najednou spousta informací, takže pro zjednodušení si musíte pamatovat pouze čtyři věci:

  1) **Můžete kdykoli říct, cokoli chcete.** Toto je hra o komunikaci. Můžete mluvit veřejně se skupinou nebo vést soukromé rozhovory, záleží to na vás.

  2) **Žádné šmírování.** Prosím, udržujte svůj žeton postavy v tajnosti a nikdy se nedívejte do grimoáru, který obsahuje všechny herní postavy.
  Pokud uvidíte něco, co byste neměli, zkazí to zábavu všem.

  3) **Zeptejte se vypravěče na všechno, co potřebujete vědět.** Pokud jste zmatení, nerozumíte tomu, jak funguje vaše postava či postava,
  za kterou se vydáváte, nebo se v noci stane něco, co nechápete, nebo jen potřebujete strategickou radu - ať je to cokoli,
  neváhejte a zeptejte se. Vypravěč je neutrální a jeho úkolem je pomáhat hráčům, aby pochopili pravidla a při hře se bavili.
  Ozvěte se, když se budete chtít na něco zeptat, a promluvíte si v soukromí, aby to nikdo jiný neslyšel.

  4) **Hrajte ohleduplně.** Toto je hra o podvodech a lsti, proto se prosím k ostatním hráčům chovejte ohleduplně a s respektem. Zabíjejte s grácií a umírejte důstojně.

  ### Před první nominací

  Vypravěč se chystá požádat o nominace. Hráče nominujete tak, že jednoduše řekněte jeji jméno. Například: „Nominuji Davida."
  Když je hráč nominován, všichni hlasují o tom, zda ho popravit. Vypravěč takto zvedne ruku (_ukažte na Davida_) a řekne:
  „Hlasy pro Davida, začínáme." Vypravěč bude pohybovat rukou ve směru hodinových ručiček (_předvedte to_): bude-li vaše ruka nahoře,
  když k vám přijde, je to hlas, bude-li dole, není to hlas.

  Každý den můžete hlasovat pro libovolný počet hráčů a kdo získá nejvíce hlasů, je popraven. Tento hráč potřebuje minimálně tolik hlasů,
  kolik odpovidá polovině živých hráčů, jinak se poprava neuskuteční. Ziská-li více nominovaných hráčů stejný počet hlasů, není popraven žádný hráč.

  I když zemřete, stále jste důležitou součástí hry. Stále mluvíte a v noci zavíráte oči ke spánku. A především stále se svým týmem vyhráváte,
  nebo prohráváte. Ve skutečnosti o výsledku hry obvykle rozhodují hlasy a názory mrtvých hráčů.
  Když zemřete, ztratíte schopnost své postavy, již nemůžete nominovat a na zbytek hry máte pouze jeden hlas, takže ho použijte uvážlivě.

