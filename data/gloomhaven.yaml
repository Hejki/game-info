description: |
  **Gloomhaven** je kooperativní fantasy kampaň s taktickými souboji.
  Každý žoldnéř má vlastní sadu akčních karet a v každém kole využije
  horní akci jedné a dolní akci druhé z dvojice zvolených karet.

  Omezený počet karet vytváří tlak na hospodaření se silami.
  Plněním scénářů získáváte zkušenosti a vybavení a odemykáte další obsah
  rozsáhlého světa i nové možnosti pro celou družinu.
