description: |
  **Nakrmte Krakena** je hra se skrytými rolemi, v níž se celá posádka
  plaví na stejné lodi, ale každý sleduje jiné cíle. Námořníci chtějí
  bezpečně doplout do přístavu, piráti loď odklonit a vůdce kultu
  usiluje o setkání s děsivým Krakenem.

  Volíte velení, hlasujete o jeho důvěryhodnosti a prostřednictvím
  navigačních karet ovlivňujete směr plavby. Z jednotlivých rozhodnutí
  zkoušíte odhalit spojence i zrádce, zatímco ostatní přesvědčujete
  o vlastní nevině. Vyhraje frakce, které se podaří prosadit svůj cíl;
  důvěra na palubě přitom mizí rychleji než pevnina za obzorem.
