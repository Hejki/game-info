description: |
  **Pilgrims** je kompetitivní rodinná hra pro 1–4 hráče. Hra se hraje na 4 kola,
  během kterých se hráči snaží získat co nejvíce vítězných bodů.
  Každý hráč se svou figurkou putuje po mapě, sbírá karty předmětů a rozšiřuje svou družinu o nové společníky.
  Důmyslným kombinováním karet předmětů a společníků lze navíc aktivovat dodatečné schopnosti.
  Tyto karty lze také využít k plnění karet dobrodružství, které hráčům při nášejí nejen cenné body,
  ale mohou je odměnit i užitečnými vylepšeními nebo žetony čtyřlístků.

