description: |
  **Shrinkopolis** je budovatelská karetní hra ze světa zmenšených lidí.
  V obřím obývacím pokoji vytváříte vlastní čtvrť z nalezených předmětů
  a snažíte se získat podporu obyvatel, abyste se stali starostou města.

  Během pěti kol vybíráte dvojice sousedících karet ze společné nabídky.
  Karty města připojujete ke své čtvrti a dokončováním spojů získáváte
  zdroje nebo body. Zdroje pak utrácíte za karty odměn, které přidávají
  zvířata, kulturu a užitečné nástroje. O vítězi rozhodne součet bodů
  za vybudovanou čtvrť a splněné cíle. Hra nabízí také sólovou,
  kooperativní a týmovou variantu i kampaňový modul.
