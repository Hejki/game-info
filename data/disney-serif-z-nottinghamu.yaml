description: |
  **Disney Robin Hood: Šerif z Nottinghamu** je blafovací hra, ve které
  převážíte zboží pro utiskované vesničany a střídáte se v roli šerifa.
  Jako Robin Hood či některý z jeho přátel tajně naplníte kupecký vak
  kartami a oznámíte, co v něm nesete. Ne vždy přitom musíte říkat pravdu.

  Šerif rozhoduje, které vaky prohledá. Odhalená lež znamená pokutu,
  ale za neprávem podezřívaného poctivce musí zaplatit sám. Přesvědčování,
  odhad soupeřů a správně načasovaný risk vám pomohou získat největší
  bohatství a stát se nejúspěšnějším dobrodincem.
