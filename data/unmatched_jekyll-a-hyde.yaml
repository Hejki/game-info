description: |
  Dvě strany jednoho muže - vypočitavý Dr. Jekyll a strašlivý pan Hyde.
  Který z nich se představí jako původce vašeho konce?

  ### Zvláštní schopnosti
  Hru začínáš jako Dr. Jekyll.

  Na začátku svého tahu se můžeš proměnit v Dr. Jekylla, nebo pana Hyda.

  **Jako pan Hyde:** Po každém Manévru si uštědři 1 zranění.

