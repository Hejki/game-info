description: |
  **Mělčiny lítosti** jsou krátká karetní hra o lovu podivných mořských
  tvorů. Z šesti lovišť vytahujete úlovky, které mají různou hodnotu,
  obtížnost a znepokojivé schopnosti. Cílem je nasbírat nejhodnotnější
  kořist a přitom si nenaložit příliš mnoho zrůdných exemplářů.

  V tahu odhalíte dvě karty, jednu se pokusíte chytit a druhou vrátíte
  do vody. Sílu pro další lov získáváte z již chycených úlovků a jejich
  jednorázové schopnosti vám pomáhají měnit situaci nebo škodit soupeřům.
  Na konci sečtete hodnotu své kořisti; největší sbírka zrůdných úlovků
  však přináší bodovou ztrátu.

  České rozšířené vydání obsahuje také **Trvalé výčitky** s trvalými
  efekty a **Rybáře a Gloga**, díky němuž lze hrát i sólo.
