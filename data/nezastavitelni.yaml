description: |
  **Nezastavitelní** jsou sólová a kooperativní karetní hra ze sci-fi
  světa, který ohrožují mocní nepřátelé. Vyberete si hrdinu a postupně
  rozvíjíte jeho schopnosti, abyste se dokázali postavit závěrečnému bossovi.

  Vedle získávání nových karet upravujete také samotné karty v balíčku:
  vylepšení zasouváte do jejich obalů, čímž měníte jejich účinky.
  Kombinujete schopnosti, udržujete přísun akcí a karet a zároveň
  odrážíte menší hrozby. Musíte zesílit dostatečně rychle, protože
  vyčerpání zdraví nebo příliš vysoké ohrožení znamená porážku.
  Každý ze tří bossů přináší jinou výzvu pro jednoho hráče i dvojici.
