description: |
  **Na louce** je karetní hra o pozorování přírody, ve které vytváříte
  vlastní sbírku rostlin, zvířat, krajin a nalezených předmětů. Každá
  karta s akvarelovou ilustrací přináší body a symboly potřebné pro
  další objevy.

  Pomocí žetonů cest vybíráte karty ze společné nabídky nebo využíváte
  akce u táboráku. K vyložení nových druhů potřebujete vhodné prostředí
  a další viditelné symboly; překrytím starších karet však část těchto
  možností ztratíte. Cílem je vytvořit co nejhodnotnější propojenou
  sbírku a splnit společné cíle. Hra obsahuje také sólový režim.
