description: |
  **The Elder Scrolls: Zrada v druhém věku** je kooperativní dobrodružná
  hra z Tamrielu. Vytvoříte si vlastního hrdinu kombinací rasy, povolání
  a dovedností a společně se vydáte prozkoumávat provincie, plnit úkoly
  a překazit nebezpečné spiknutí.

  Průzkum střídají taktické souboje na hexových plánech. Kostky dovedností,
  vybavení a rychlý rozvoj postavy vám umožňují zkoušet různé bojové styly
  a vzájemně se doplňovat. Jedna výprava se skládá ze tří herních sezení,
  mezi nimiž si uchováváte pokrok. Proměnlivé úkoly a sestavy postav
  podporují opakované hraní bez nutnosti dlouhé souvislé kampaně.
