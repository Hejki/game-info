description: |
  **Dorfromantik: Sakura** je samostatná kooperativní hra, ve které společně
  skládáte japonskou krajinu ze šestihranných destiček. Propojujete rýžová pole,
  vesnice a rozkvetlé třešně, budujete cesty a řeky a plníte úkoly určující
  velikost jednotlivých oblastí.

  Cílem je získat co nejvyšší společné skóre. Body přinášejí splněné úkoly,
  uzavřená území s vlajkami i nejdelší cesta a řeka. Výsledky jednotlivých partií
  posouvají kampaň, ve které postupně odemykáte nové herní prvky a další výzvy.
  Původní Dorfromantik ke hraní nepotřebujete.
