description: |
  **Gang** je kooperativní pokerová hra o sehraném týmu lupičů.
  Každý zná pouze své vlastní karty a bez sdělování jejich hodnot
  se snažíte společně odhadnout, kdo má nejslabší a kdo nejsilnější
  kombinaci. Své odhady vyjadřujete výběrem žetonů.

  Jak na stůl přibývají společné karty, mění se síla vašich kombinací
  i pořadí celého týmu. Pokud se na konci správně seřadíte, otevřete
  trezor; chyba spustí alarm. K vítězství potřebujete vyloupit tři
  trezory dřív, než alarm zazní potřetí. Pokerové zkušenosti nejsou nutné.
