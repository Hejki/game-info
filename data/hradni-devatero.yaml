description: |
  **Hradní devatero** je svižná karetní hra, ve které najímáte postavy
  z hradu i podhradí a skládáte z nich mřížku tři krát tři karty.
  Každá postava má okamžitý efekt a vlastní podmínku závěrečného bodování,
  takže záleží nejen na tom, koho vyberete, ale i kam jej umístíte.

  Zlaťáky platíte za nové karty a klíči ovlivňujete nabídku či polohu
  herolda, který určuje dostupnou lokaci. Po devíti tazích máte své
  devatero hotové a porovnáte body. Vyhraje ten, kdo nejlépe propojí
  schopnosti postav, jejich erby a vzájemné umístění.
