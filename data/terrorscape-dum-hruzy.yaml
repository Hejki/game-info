description: |
  **Terrorscape: Dům hrůzy** je asymetrická hororová hra jednoho proti
  ostatním. Skupina přeživších hledá únikovou cestu z opuštěného sídla,
  zatímco další hráč ovládá vraha, který je chce dostihnout.
  Oddělující clona skrývá pohyb přeživších před jejich pronásledovatelem.

  Přeživší prohledávají místnosti, sbírají klíče, staví barikády
  a opravují vysílačku. Musí si pomáhat, ale také hlídat hluk,
  který prozrazuje jejich polohu. Vrah využívá vlastní schopnosti
  a stopy, aby někoho dopadl dřív, než se skupině podaří uniknout
  nebo přivolat pomoc.
