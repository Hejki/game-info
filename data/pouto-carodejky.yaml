description: |
  **Pouto čarodějky** je příběhová dobrodružná hra o dívce Reni,
  která na Čarostrově nečekaně probudí své magické schopnosti.
  V ilustrovaných scénách prozkoumáváte místa, mluvíte s postavami,
  získáváte předměty a pomocí odkazů pokračujete v knize příběhů.

  Učíte se kouzla, připravujete lektvary a rozhodnutími měníte průběh kampaně.
  Hrát lze sólo nebo společně; uvedený čas patří jednomu hernímu sezení.
