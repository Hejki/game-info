description: |
  Navázání pohledu s tímto legendárním upírem znamená jistý skon.
  Zatímco se mysl oběti potácí mlhou, z její krve si on a jeho sestry udělají chutnou hostinu.

  ### Zvláštní schopnosti
  Na začátku svého tahu můžeš uštědřit 1 zranění libovolnému bojovníkovi sousedícímu s Drákulou.
  Pokud tak učiníš, táhni kartu.

