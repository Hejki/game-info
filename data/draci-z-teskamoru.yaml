description: |
  **Draci z Teskamoru** jsou sólové karetní dobrodružství, které odehrajete
  celé v rukou, bez potřeby stolu. Jako učedník magie putujete čtyřmi
  nebezpečnými oblastmi a připravujete se na závěrečné střetnutí s drakem.

  Pomocí šestnácti karet mága překonáváte nástrahy cest a bojujete
  s nepřáteli. Rozhodujete, které karty využít k akci a které obětovat
  k jejímu posílení. Za úspěchy získáváte zkušenosti a vylepšujete své
  karty jejich otáčením; zranění je naopak oslabují a ztracený čas vás
  může přinutit čelit drakovi dřív, než jste připraveni.

  Cílem je projít všemi oblastmi, zvládnout závěrečnou cestu a porazit
  dračího protivníka. Malý balíček tak skrývá taktickou výzvu, v níž
  záleží na každé kartě a správném hospodaření se silami.
