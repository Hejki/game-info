description: |
  **MIND MGMT** je dedukční hra se skrytým pohybem ze světa psychické
  špionáže. Jeden hráč představuje Náboráře tajné organizace, který se
  nepozorovaně pohybuje městem a získává nové rekruty. Ostatní jako
  Odpadlí agenti spolupracují, aby jeho trasu odhalili a dopadli ho včas.

  Pomocí otázek, stop a poznámek postupně omezujete místa, kde se může
  Náborář nacházet. Obě strany mají zvláštní schopnosti a po partiích
  mohou přidávat další herní prvky vyrovnávající jejich síly.
  Náborář vyhraje, pokud získá dost rekrutů nebo unikne do vypršení času;
  agenti zvítězí jeho zajetím. Doprovodná aplikace umožňuje také sólo
  či kooperativní hru proti automatickému protivníkovi.
