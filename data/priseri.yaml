description: |
  **Příšeří: Hrdinům vstup zakázán** je kooperativní hra, ve které
  se ujímáte klanů příšer a bráníte své podzemí před hrabivými hrdiny.
  Každý klan má vlastní schopnosti, počet figurek a balíček akčních
  karet, takže se při obraně musíte dobře doplňovat.

  Hraním karet nasazujete příšery, přesouváte je mezi místnostmi,
  útočíte, připravujete pasti a otevíráte portály. Získaná kořist vám
  umožňuje rozšiřovat balíčky o nové možnosti. Po vašich tazích vpadají
  do podzemí další hrdinové řízení kartami. Pokud přečkáte dvě vlny
  a uchráníte hlavní poklad, vyhráváte společně. Různé scénáře,
  klany a úrovně obtížnosti mění podobu každé obrany.
