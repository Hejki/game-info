description: |
  **Světlonoš** je hra o putování světem, který pohltila tma. Jako
  dobrodruh získáváte společníky, sestavujete jejich schopnosti do
  výhodných kombinací a shromažďujete záblesky světla, abyste do krajiny
  vrátili barvy.

  Každé kolo najmete nového společníka a získáte příslušné kostky.
  Jejich výsledky pak aktivují příznivé i nepříznivé efekty vaší družiny
  a pomáhají vám postupovat po mapě. Oboustranný plán nabízí dvě odlišné
  výpravy. Po osmi dnech vítězí hráč, který získá nejvíce světla za
  společníky, svou cestu a další nasbírané odměny.
