description: |
  **Hemžíci** jsou rodinná hra o vytváření pestré zahrady. Z nabídky vybíráte
  dílky, přikládáte je ke své zahrádce a skládáte barevné oblasti s květinami,
  houbami a loužemi, které lákají drobné obyvatele.

  Opylené oblasti přivádějí včely, celé opylené dílky zase kolibříky.
  Tajemné hemžíky získáte za splnění různých prostorových podmínek.
  Po dvanácti kolech vítězí zahrada s největším počtem přilákaných tvorů;
  jejich proměnlivá nabídka pokaždé vybízí k jinému uspořádání dílků.
