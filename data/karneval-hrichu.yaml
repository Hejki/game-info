description: |
  **Karneval hříchů** je krátká blafovací hra s kostkami a tajným výběrem
  karet. Během sedmi kol se účastníte karnevalu v New Orleans a pomocí
  sedmi smrtelných hříchů usilujete o co nejcennější kořist.

  Po hodu kostkami každý skrytě zvolí jeden dosud nepoužitý hřích.
  Odhalené karty se vyhodnotí v daném pořadí a rozhodnou, kdo získá
  které kostky a jak zasáhne soupeře. Musíte odhadovat jejich úmysly
  a správně načasovat vlastní schopnosti. Nejvyšší celkový bodový zisk
  vám na konci přinese titul krále karnevalu.
