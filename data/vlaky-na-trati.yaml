description: |
  **Vlaky na trati** jsou kompaktní karetní zakreslovací hra.
  Přikládáte karty tří souběžných tratí, po kterých všichni posouvají
  své lokomotivy. Symboly navštívených stanic si zaznamenáváte do archu
  a skládáte z nich co nejvýhodnější bodovací kombinace.

  Mince vám umožní další akce, například posun pomalejšího vlaku.
  Vyhrává hráč s nejvyšším skóre po dokončení společné tratě.

