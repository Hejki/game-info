description: |
  **Hlubiny lítosti** je hororová hra o rybaření vycházející z mytologie Cthulhu H. P. Lovecrafta,
  ve které se ze slaných hlubin tahají stále děsivější úlovky. Ovládněte své šílenství, pokoušejte své štěstí
  a modlete se, až se vydáte na plavbu do hrůzně tajuplných hlubin. Do nitra se vám však může vkrást lítost.
  Získáváním lítosti lze dosáhnout větších odměn, ale když budete své štěstí pokoušet příliš, můžete přijít
  o hodně. Možná i o rozum! V hlubinách na vás čeká přes 140 unikátních úlovků. Každý bizarnější než ten předchozí!

