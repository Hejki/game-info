description: |
  **Ukijo** je kapesní logická hra, ve které sami nebo společně
  vytváříte obraz krajiny ze symbolů přírody. Na začátku zvolíte výzvu
  tvořenou několika podmínkami a pokoušíte se je všechny současně splnit.

  V tazích přikládáte karty vodorovně či svisle do společného prostoru,
  případně jimi překrýváte dříve položené karty. Výsledná krajina nesmí
  přesáhnout rozměr šest krát šest symbolů. Můžete se domlouvat na
  společném plánu, ale nesmíte popisovat kartu, kterou držíte v ruce.
  Po zahrání všech karet ověříte, zda jste splnili celou výzvu.
  Různé kombinace úkolů nabízejí několik úrovní obtížnosti.
