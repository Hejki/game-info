description: |
  **High Frontier (4. edice)** neboli **High Frontier 4 All** je náročná
  strategická hra o průzkumu a průmyslovém využití Sluneční soustavy.
  Řídíte kosmickou organizaci, dražíte technologické patenty a z pohonů,
  robonautů a rafinerií sestavujete vlastní kosmické výpravy.

  Při plánování letů musíte počítat s hmotností lodě, zásobami paliva
  i vlastnostmi pohonu. Průzkum planetek a měsíců vám umožní získávat
  suroviny, budovat továrny a vyrábět pokročilejší technologie.
  Cílem je získat nejvíce bodů za rozvoj mimozemské infrastruktury
  a další úspěchy. Různé výukové a pokročilé varianty umožňují postupně
  pronikat do tohoto podrobného modelu kosmického podnikání.
