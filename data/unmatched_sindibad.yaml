description: |
  S každou další vzrušující výpravou rostou jeho znalosti i moc. Porazte jeho věrného Nosiče co nejdříve,
  než jej přibývající zkušenosti učiní nezastavitelným!

  ### Zvláštní schopnosti
  Při vyhodnocení akce "manéver" můžeš přesunout své bojovníky navíc až o tolik polí,
  kolik karet **CESTY** se nachází ve tvém odhazovacím balíčku.

