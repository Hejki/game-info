description: |
  **Kočičí kousky** jsou svižná karetní hra, ve které se kočky vměstnávají
  do nejrůznějších nádob. Před sebou máte dvě řady částečně skrytých karet
  a snažíte se jejich výslednou hodnotu snížit na minimum.

  V tazích dobíráte karty, vyměňujete je za své, odhalujete skryté hodnoty
  nebo zakrýváte karty do součtu jedenáct. Shodné hodnoty v jednom sloupci
  můžete odložit stranou, čímž si ještě vylepšíte skóre. Musíte přitom
  odhadnout, kdy riskovat a kdy se blíží konec kola.

  Hráč s nejnižším skóre získá žeton lahve. Kdo jako první nasbírá dva,
  vyhrává celou hru.
