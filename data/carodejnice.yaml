description: |
  **Čarodějnice!** jsou sólová karetní hra, ve které vedete sabat žen
  chránících městečko Wildegrens před skutečnými nestvůrami. Obyvatelé
  však jejich magii podezírají a vy musíte nejen odvracet nebezpečí,
  ale také přesvědčit porotu, že vaše čarodějnice nejsou hrozbou.

  Při plnění misí rozhodujete, zda čarodějnice zůstane skrytá a použije
  slabší schopnost, nebo se odhalí a uvolní svou plnou moc. Odhalením
  ovšem riskujete její ztrátu pro další průběh partie. Chytrým využitím
  omezeného balíčku musíte zvládnout výzvy a získat přízeň porotců.
  Vedle samostatných partií nabízí hra také příběhovou kampaň.
