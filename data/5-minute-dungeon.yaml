description: |
  **5-Minute Dungeon** je kooperativní karetní hra v reálném čase.
  Každý si vybere hrdinu s vlastním balíčkem a zvláštní schopností
  a společně vyrazíte do podzemí plného příšer, překážek a padouchů.

  Nečekáte na tah: všichni současně vykládáte karty se symboly,
  které vyžaduje právě odhalená výzva. Musíte rychle komunikovat,
  šetřit správné karty a využívat schopnosti hrdinů. Na zdolání
  jednoho dungeonu včetně závěrečného bosse máte pouhých pět minut.
  Po vítězství se můžete pustit do dalšího, obtížnějšího podzemí.
