description: |
  **Olejovky** jsou sólová hra o vedení malé konzervárny na španělském
  pobřeží. Začínáte s jedinou lodí a trochou peněz a staráte se o celý
  provoz: od výlovu přes vylepšování flotily až po prodej rybích konzerv.

  Moře představuje sáček žetonů ryb a vody. Při každém výlovu volíte,
  co si ponecháte na zpracování a co pustíte zpět, aby se ryby mohly
  rozmnožovat. Zisk sám nestačí: pokud moře vylovíte, podnik neuspěje.
  Dvanáct měsíčních scénářů přináší různé trhy a cíle, které prověří
  rovnováhu mezi rozvojem firmy a udržitelným hospodařením.
