description: |
  Silný jako strom, nezkrotný jako vítr — burácející Bigfoot vyráží na scénu v těsném závěsu s hbitým Zajdalenem.
  Pocítíte závan moci, a najednou jsou ti tam. Nebyl to jen výplod vaší fantazie?

  ### Zvláštní schopnosti
  Pokud se na konci tvého tahu žádný z protivníkových bojovníků nenachází v Bigfootově oblasti, můžeš táhnout 1 kartu.

