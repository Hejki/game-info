description: |
  **Root** je asymetrická strategická hra o boji lesních zvířat za vládu
  nad Lesní říší. Každá ze čtyř frakcí používá vlastní pravidla,
  hospodaření i způsob získávání bodů, a proto musí dobře rozumět
  nejen sobě, ale také plánům soupeřů.

  Markýza z Kocourova staví budovy a rozvíjí průmysl, Orlí hnízdo
  rozšiřuje svou dynastii plněním stále náročnějšího výnosu a Lesní
  aliance šíří sympatie a připravuje povstání. Samostatný Tulák putuje
  mezi frakcemi, plní úkoly a používá své vybavení. Pohyb, výroba,
  souboje a proměnlivá spojenectví rozhodnou, kdo první získá dost
  vítězných bodů nebo splní zvláštní podmínku dominance.
