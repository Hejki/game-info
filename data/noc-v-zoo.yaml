description: |
  **Noc v zoo** je rodinná taktická hra, ve které vracíte zvířata
  z nočních výletů zpátky do výběhů. Vybíráte dílky ze společné nabídky
  a přikládáte je na svou desku, čímž vytváříte cesty a spouštíte akce.

  Každý druh zvířete se pohybuje jinak a přináší body za jiné podmínky.
  Musíte proto promýšlet pořadí přesunů a uspořádání krajiny, aby se
  zvířata vzájemně neblokovala a stihla se bezpečně vrátit.
  Po třech kolech vítězí hráč s nejvíce body; hra obsahuje také sólový režim.
