description: |
  **Fort** je karetní hra o dětské partě a budování nejlepšího bunkru.
  Nabíráte kamarády do svého balíčku, sháníte pizzu a hračky a využíváte
  je k rozvoji pevnosti i získávání vítězných bodů.

  Zahrané karty nabízejí vlastní akci a veřejnou akci, kterou mohou
  následovat také ostatní hráči. Kamarádi, které ve svém tahu nevyužijete,
  ale zůstanou na dvorku a mohou se přidat k soupeřově partě.
  Musíte tedy rozvíjet svůj balíček a zároveň se starat o jeho členy.
  O vítězi rozhodne výsledné skóre, včetně postaveného bunkru a zvláštních cílů.
