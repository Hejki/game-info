description: |
  V ruce třímá mocný Excalibur a záda mu kryje úskočný čaroděj Merlin.
  Jeho největší silou je však víra a odhodlání zajistit, že skutek bude dokonán.

  ### Zvláštní schopnosti
  Ůtok krále Artuše můžeš POSÍLIT. Kartu, kterou chceš využít k POSÍLENÍ, zahraj spolu s útočnou kartou lícem dolů.
  Pokud tvůj protivník zruší efekty tvé útočné karty, karta určená k POSÍLENÍ bude odhozena bez efektu.

