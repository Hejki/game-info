description: |
  **Máš pět?** je rychlá deduktivní hra o odhalování pěti skrytých čísel.
  Dílky ve vašem stojánku vidí všichni soupeři, ale vy sami ne.
  Pomocí nápověd a postupného vylučování možností se snažíte svou
  vzestupně seřazenou pětici určit dříve než ostatní.

  V tahu odkrýváte další dílek ze zásoby a žádáte souseda o informaci.
  Můžete zjistit, kam se známé číslo řadí mezi vaše skryté dílky,
  nebo porovnat počty jejich teček. Poznatky si zaznamenáváte na
  stíratelnou desku a využíváte také informace viditelné na stole.
  Jakmile jste si jistí, oznámíte všech pět čísel. Správný odhad
  znamená okamžité vítězství, chyba vás však vyřadí z boje o výhru.
