description: |
  **Zloba** je převahová strategická hra, ve které soupeřící frakce
  bojují o území poloostrova Dřidál. Vybíráte si akční kostky a jejich
  prostřednictvím získáváte suroviny, nasazujete a přesouváte jednotky
  nebo útočíte na protivníky.

  Každá frakce má vlastní elitní jednotky a schopnosti, takže vyžaduje
  jiný přístup k boji. Klíčem k úspěchu je ovládání oblastí, chytré
  rozmístění armády a správné načasování silných jednorázových efektů.
  V běžné hře získáváte body za ovládaná území a partie končí po kole,
  ve kterém některá frakce dosáhne třiceti bodů.

  Vedle soupeření dvou až čtyř hráčů nabízí hra také sólovou
  a kooperativní variantu se scénáři proti automatizovanému protivníkovi.
