description: |
  **Poslední holka: Přehrávač** je základní krabice sólové hororové hry.
  Jako poslední přeživší zachraňujete oběti, prohledáváte prostředí
  a připravujete se na střet s vrahem, jehož chování řídí herní karty.

  Akční karty a hody kostkami určují, co během kola zvládnete.
  **Přehrávač není samostatně hratelný:** potřebujete také alespoň
  jednu krabici celovečerního filmu s vrahem, lokací a hrdinkami.
