description: |
  **Na vlnách neznáma** jsou příběhové pirátské dobrodružství, ve kterém
  tvoříte posádku jedné lodi. Společně prozkoumáváte moře a ostrovy,
  zásobujete loď, bojujete a plníte kapitánovy úkoly. Každý pirát zároveň
  rozvíjí vlastní příběh a usiluje o osobní slávu.

  V časově omezeném plánování si rozdělujete akce, které pak postupně
  vyhodnocujete pomocí kostek a příběhových událostí. Bezplatná webová
  aplikace řídí scénáře a odhaluje následky vašich rozhodnutí.
  Musíte přežít jako posádka, ale i splnit dostatek vlastních cílů,
  aby se z vašeho piráta stala legenda. Rozehraný scénář lze uložit.
