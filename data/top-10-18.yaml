description: |
  **TOP 10 18+** je samostatná kooperativní párty hra s odvážnými
  tématy pro dospělé. Pracuje se stejným principem jako původní TOP 10,
  ale zadání míří k lechtivému humoru a otevřenějším odpovědím.
  Základní hru ke hraní nepotřebujete.

  Každý dostane tajnou kartu s číslem od jedné do deseti a vymyslí
  odpověď odpovídající své pozici na zadané škále. Kapitán se pak snaží
  odpovědi seřadit od nejnižšího čísla po nejvyšší, aniž by čísla znal.
  Za chybné pořadí tým ztrácí životy. Pokud společně zvládnete pět kol
  a alespoň jeden život vám zůstane, vyhráváte všichni.
